name: Проверка сборки

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Получить код
        uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json
      - name: Установить зависимости
        run: npm install --no-audit --no-fund
      - name: Проверить History Bootstrap и рекомендации
        run: npm run test:history-bootstrap
      - name: Проверить production build
        run: npm run build
